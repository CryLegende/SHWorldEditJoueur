name: SHWorldEditJoueur
version: '${project.version}'
main: org.Cry_Legende.sHWorldEditJoueur.SHWorldEditJoueur
api-version: '1.20'
author: Cry_Legende
description: Permet aux joueurs de placer ou couper des blocs en survie avec un coût et des limites.
softdepend: [SuperiorSkyblock2, FastAsyncWorldEdit, Vault, SHLogs]

commands:
  place:
    description: Place des blocs dans votre sélection.
    usage: /place [cancel]
    aliases: [p]
  cut:
    description: Coupe les blocs de votre sélection.
    usage: /cut [confirm|cancel]
  shworldeditjoueur:
    description: Administration de SHWorldEditJoueur.
    usage: /shworldeditjoueur <reload|info>
    aliases: [shwe]

permissions:
  shworldeditjoueur.use:
    description: Permet d'utiliser /place et /cut.
    default: true
  shworldeditjoueur.group.default:
    description: Palier par défaut (limite de blocs et prix du groupe default de config.yml).
    default: true
  shworldeditjoueur.group.vip:
    description: Palier VIP (limite de blocs et prix du groupe vip de config.yml).
    default: op
  shworldeditjoueur.group.vip+:
    description: Palier VIP+ (limite de blocs et prix du groupe vip+ de config.yml).
    default: op
  shworldeditjoueur.group.vipelite:
    description: Palier VIP Elite (limite de blocs et prix du groupe vipelite de config.yml).
    default: op
  shworldeditjoueur.admin:
    description: Toutes les sous-commandes de /shworldeditjoueur.
    default: op
    children:
      shworldeditjoueur.admin.reload: true
      shworldeditjoueur.admin.info: true
  shworldeditjoueur.admin.reload:
    description: /shworldeditjoueur reload (recharger config.yml et messages.yml).
    default: op
  shworldeditjoueur.admin.info:
    description: /shworldeditjoueur info (palier appliqué à un joueur).
    default: op
