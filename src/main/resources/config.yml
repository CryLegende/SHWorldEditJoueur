# Configuration de SHWorldEditJoueur par Cry_Legende
settings:
  build-sound: "BLOCK_STONE_PLACE"
  cut-sound: "BLOCK_STONE_BREAK"
  cancel-word: "cancel"
  confirm-word: "confirm"
  cancel-time: 20 # secondes

  # Blocs qui ne donnent pas l'objet correspondant lorsqu'ils sont coupés.
  # Ceci est utile pour ne pas remplacer des enchantements comme Silk Touch.
  # Le format est "BLOC_CASSE:BLOC_A_DONNER". Utilisez "AIR" pour ne rien donner.
  # Astuce : Pour la plupart des blocs (pierre -> roche, minerais, etc.), le plugin gère cela automatiquement.
  # N'ajoutez ici que les exceptions que vous souhaitez.
  replace-give:
    - "GLASS:AIR"
    - "GLASS_PANE:AIR"
    - "WHITE_STAINED_GLASS:AIR"
    - "WHITE_STAINED_GLASS_PANE:AIR"
    - "ORANGE_STAINED_GLASS:AIR"
    - "ORANGE_STAINED_GLASS_PANE:AIR"
    - "MAGENTA_STAINED_GLASS:AIR"
    - "MAGENTA_STAINED_GLASS_PANE:AIR"
    - "LIGHT_BLUE_STAINED_GLASS:AIR"
    - "LIGHT_BLUE_STAINED_GLASS_PANE:AIR"
    - "YELLOW_STAINED_GLASS:AIR"
    - "YELLOW_STAINED_GLASS_PANE:AIR"
    - "LIME_STAINED_GLASS:AIR"
