# Limites et prix de chaque groupe. Un joueur reçoit le groupe de plus haute priorité dont il a la permission
# shwe.group.<nom>.
#   priority      Priorité du groupe (la plus haute est vérifiée en premier).
#   max-blocks    Nombre maximum de blocs par action.
#   place-price   Prix d'un bloc posé avec /place.
#   cut-price     Prix d'un bloc coupé avec /cut.
groups:
  vipelite:
    priority: 4
    max-blocks: 5000
    place-price: 25
    cut-price: 25
  vip+:
    priority: 3
    max-blocks: 3000
    place-price: 30
    cut-price: 30
  vip:
    priority: 2
    max-blocks: 1000
    place-price: 32
    cut-price: 32
  default:
    priority: 1
    max-blocks: 500
    place-price: 34
    cut-price: 34