# ----------------------------------------------------------------#
#                Configuration de SHWorldEditJoueur               #
# ----------------------------------------------------------------#
#
# Permet aux joueurs de placer ou de couper les blocs de leur sélection WorldEdit sur leur île,
# contre de l'argent (Vault), avec une limite de blocs et un prix par groupe.
#
# Commandes :
#   /place (alias /p)   Place dans la sélection le bloc cliqué dans l'inventaire.
#   /place cancel       Annule l'action en attente.
#   /cut                Coupe les blocs de la sélection et rend les objets.
#   /cut confirm        Confirme la coupe.
#   /cut cancel         Annule l'action en attente.
#   /shworldeditjoueur reload   (alias /shwe, console comprise)   Recharge config.yml et messages.yml : prix, limites,
#                       groupes, blocs interdits, objets rendus, sons, textes. Un fichier YAML invalide laisse l'ancienne
#                       configuration en place et affiche le fichier et la ligne. Les actions en attente ne changent pas.
#   /shworldeditjoueur info [joueur]   Palier que le plugin applique à un joueur : groupe, limite de blocs, prix, action
#                       en attente (console : le joueur est obligatoire, en ligne).
#
# Permissions :
#   shworldeditjoueur.use                Utiliser /place et /cut (tous les joueurs par défaut).
#   shworldeditjoueur.group.<groupe>     Appartenir à un groupe de la section groups : default (tous), vip, vip+, vipelite
#                                        (op par défaut). Le nœud est construit avec la clé du groupe : un groupe
#                                        « youtube » ajouté à groups demande shworldeditjoueur.group.youtube, à accorder
#                                        dans LuckPerms.
#   shworldeditjoueur.admin              /shworldeditjoueur reload et info (op par défaut).
#   shworldeditjoueur.admin.reload       /shworldeditjoueur reload (op par défaut).
#   shworldeditjoueur.admin.info         /shworldeditjoueur info (op par défaut).
#
# Les textes sont dans messages.yml. Le journal des /place et /cut est écrit dans le fichier « actions » de SHLogs.
settings:
  # Son joué à la fin d'un /place (nom de son ou clé minecraft:...).
  build-sound: "BLOCK_STONE_PLACE"
  # Son joué à la fin d'un /cut (nom de son ou clé minecraft:...).
  cut-sound: "BLOCK_STONE_BREAK"
  # Mot qui annule l'action en attente (/place <mot>, /cut <mot>).
  cancel-word: "cancel"
  # Mot qui confirme la coupe en attente (/cut <mot>).
  confirm-word: "confirm"
  # Secondes avant qu'une action en attente de confirmation expire.
  cancel-time: 20

  # Objet rendu par /cut à la place du bloc coupé, comme sans Toucher de soie.
  # Format "BLOC_COUPE:OBJET_RENDU" ou "BLOC_COUPE:OBJET_RENDU;quantité". AIR ne rend rien.
  # Les autres blocs (pierre, minerais...) rendent leur objet habituel sans être listés.
  replace-give:
    - "GLASS:AIR"
    - "GRASS_BLOCK:DIRT"
    - "STONE:COBBLESTONE"
    - "GLOWSTONE:GLOWSTONE_DUST;3"

  banned-blocks:
    # Blocs que /cut ne coupe jamais.
    cut:
      - "CHEST"
      - "HOPPER"
      - "BEDROCK"
      - "SPAWNER"
      - "PLAYER_HEAD"
    # Blocs que /place ne pose jamais.
    place:
      - "CHEST"
      - "HOPPER"
      - "BEDROCK"
      - "SPAWNER"

  # Métadonnées Bukkit posées par d'autres plugins sur les blocs à protéger : /cut ne coupe pas
  # ces blocs et /place ne les remplit pas. « elitegenerator » = bloc d'un générateur EliteGenerator.
  protected-metadata:
    - "elitegenerator"

# Limites et prix de chaque groupe. Un joueur reçoit le groupe de plus haute priorité dont il a la permission
# shworldeditjoueur.group.<nom>.
#   priority      Priorité du groupe (la plus haute est vérifiée en premier).
#   max-blocks    Nombre maximum de blocs par action.
#   place-price   Prix d'un bloc posé avec /place.
#   cut-price     Prix d'un bloc coupé avec /cut.
groups:
  vipelite:
    priority: 4
    max-blocks: 5000
    place-price: 20
    cut-price: 20
  vip+:
    priority: 3
    max-blocks: 3000
    place-price: 30
    cut-price: 30
  vip:
    priority: 2
    max-blocks: 1000
    place-price: 40
    cut-price: 40
  default:
    priority: 1
    max-blocks: 500
    place-price: 50
    cut-price: 50
