name: SHWorldEditJoueur
version: '${project.version}'
main: org.Cry_Legende.sHWorldEditJoueur.SHWorldEditJoueur
api-version: '1.20'
author: Cry_Legende
description: Permet aux joueurs de placer ou couper des blocs en survie avec un coût et des limites.
softdepend: [SuperiorSkyblock2, FastAsyncWorldEdit, Vault]

commands:
  place:
    description: Place des blocs dans votre sélection.
    usage: /place [cancel]
    aliases: [p]
  cut:
    description: Coupe les blocs de votre sélection.
    usage: /cut [confirm|cancel]
    aliases: [c]

permissions:
  shwe.use:
    description: Permet d'utiliser les commandes de base du plugin.
    default: true
  shwe.group.default:
    description: Groupe par défaut pour SHWorldEditJoueur.
    default: true
  shwe.group.vip:
    description: Groupe VIP pour SHWorldEditJoueur.
  shwe.group.vip+:
    description: Groupe VIP+ pour SHWorldEditJoueur.
  shwe.group.vipelite:
    description: Groupe VIP Elite pour SHWorldEditJoueur.
